name: portego

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portego
      POSTGRES_USER: portego
      POSTGRES_PASSWORD: portego-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portego -d portego"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - portego-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      PORTEGO_ENVIRONMENT: development
      PORTEGO_DATABASE_URL: postgresql+asyncpg://portego:portego-local@postgres:5432/portego
      PORTEGO_WEB_ORIGINS: http://localhost:3100
      PORTEGO_WEB_URL: http://localhost:3100
      PORTEGO_COOKIE_SECURE: "false"
      PORTEGO_GATEWAY_JWT_SECRET: local-development-gateway-secret-change-me
      PORTEGO_CLOUDFLARE_RELAY_URL: ${PORTEGO_CLOUDFLARE_RELAY_URL:-}
      PORTEGO_CLOUDFLARE_RELAY_SECRET: ${PORTEGO_CLOUDFLARE_RELAY_SECRET:-}
      PORTEGO_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_PORTEGO_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3100:3100"
    restart: unless-stopped

volumes:
  portego-postgres:
