services:
  - type: web
    name: portego-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /healthz
    envVars:
      - key: PORTEGO_ENVIRONMENT
        value: production
      - key: PORTEGO_DATABASE_URL
        sync: false
      - key: PORTEGO_WEB_ORIGINS
        value: https://tryportego.com,https://www.tryportego.com
      - key: PORTEGO_WEB_URL
        value: https://tryportego.com
      - key: PORTEGO_COOKIE_SECURE
        value: "true"
      - key: PORTEGO_GATEWAY_JWT_SECRET
        generateValue: true
      - key: PORTEGO_AUTO_CREATE_TABLES
        value: "false"
