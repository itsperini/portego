services:
  - type: web
    name: portego-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /healthz
    envVars:
      - key: PORTEGO_DATABASE_URL
        fromDatabase:
          name: portego-postgres
          property: connectionString
      - key: PORTEGO_WEB_ORIGINS
        sync: false
      - key: PORTEGO_WEB_URL
        sync: false
      - key: PORTEGO_COOKIE_SECURE
        value: "true"
      - key: PORTEGO_GATEWAY_JWT_SECRET
        generateValue: true
      - key: PORTEGO_AUTO_CREATE_TABLES
        value: "false"

databases:
  - name: portego-postgres
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: portego
    user: portego
