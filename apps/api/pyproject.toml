[project]
name = "portego-api"
version = "0.1.0"
description = "Portego authenticated cloud API and gateway relay"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.5",
  "asyncpg>=0.30.0",
  "fastapi[standard]>=0.116.1",
  "pyjwt>=2.10.1",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.10.1",
  "sqlalchemy[asyncio]>=2.0.43",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0",
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "ruff>=0.12.11",
]

[project.scripts]
portego-api = "portego_api.main:run"
portego-user = "portego_api.manage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portego_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
